[package]
name = "ocelotl-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Portable kernel dispatch boundary for Ocelotl."
readme = "../../README.md"

[features]
default = []
cubecl = ["dep:cubecl"]
# `_gpu` is the internal umbrella both GPU runtimes enable; the device code is
# gated on it so a single cfg covers WGPU and HIP. Pick exactly one runtime.
_gpu = []
cubecl-wgpu = ["cubecl", "cubecl/wgpu", "_gpu"]
# cubecl/std turns on cubecl-runtime's `multi_threading` cfg, which the hip
# backend's stream imports require (the wgpu path pulls std transitively).
cubecl-hip = ["cubecl", "cubecl/hip", "cubecl/std", "_gpu"]

[dependencies]
cubecl = { version = "0.10.0", default-features = false, optional = true }
half = "2.7"
ocelotl-core.workspace = true
rayon = "1.10"

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "kernel_primitives"
harness = false
